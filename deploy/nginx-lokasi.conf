# Tempel di dalam blok server { ... } situs (CloudPanel: Sites > domain > Vhost).
# Root situs: <repo>/frontend/dist/client
# 3021 = PORT backend, 3022 = FRONTEND_PORT (lihat backend/.env).
#
# ^~ wajib: tanpa itu aturan bawaan untuk .jpg/.webp akan mencari gambar di folder situs.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
}

location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:3021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 30d;
}

# CSS tanpa kode versi di namanya: selalu cek pembaruan
location ^~ /styles/ {
    expires -1;
}

# File statis dari folder root; selain itu halaman dibuat oleh server tampilan
location / {
    try_files $uri @halaman;
}

location @halaman {
    proxy_pass http://127.0.0.1:3022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires -1;
}
