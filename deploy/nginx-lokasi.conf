# Tempel di dalam blok server { ... } situs (CloudPanel: Sites > domain > Vhost).
# Ganti 3021 dengan PORT di backend/.env. Root situs: <repo>/frontend/dist
#
# ^~ wajib: tanpa itu aturan bawaan untuk .jpg/.webp akan mencari gambar di folder situs.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
}

location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:3021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 30d;
}

location / {
    try_files $uri $uri/index.html $uri.html =404;
}

# Juga mengalihkan alamat WordPress lama ke alamat baru
error_page 404 /404.html;
