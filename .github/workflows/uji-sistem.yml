name: Uji Sistem

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # kosong: database baru. skema: struktur tabel hasil impor WordPress (tanpa data).
        database: [kosong, skema]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JWT_SECRET: hanya-untuk-uji
      DB_NAME: news_portal
      PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Siapkan struktur tabel hasil impor
        if: matrix.database == 'skema'
        run: |
          mysql -h127.0.0.1 -uroot -e "CREATE DATABASE news_portal CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          mysql -h127.0.0.1 -uroot news_portal < backend/tools/ci-schema.sql

      - name: Periksa & bangun backend
        working-directory: backend
        run: |
          go vet ./...
          go build -o /tmp/server .

      - name: Jalankan backend
        working-directory: backend
        run: |
          /tmp/server > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/categories > /dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1

      - name: Semua berita dimuat otomatis & semua gambar tampil
        working-directory: backend
        env:
          MIN_NEWS: 2817
        run: |
          grep SeedNews /tmp/server.log || true
          echo "::notice::$(grep SeedNews /tmp/server.log | tail -1)"
          node tools/check-images.mjs

      - name: Uji seluruh fitur API
        if: ${{ !cancelled() }}
        working-directory: backend
        run: node tools/smoke-test.mjs

      - name: Bangun frontend dari backend asli
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm ci
          npx astro build > /tmp/build.log 2>&1 || { tail -40 /tmp/build.log; exit 1; }
          tail -3 /tmp/build.log
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          B=http://127.0.0.1:4321; S=$(curl -s "http://localhost:3000/api/news?limit=1&lite=1" | grep -oE '"slug":"[^"]+"' | head -1 | cut -d'"' -f4)
          code() { curl -s -o /dev/null -w '%{http_code}' "$B$1"; }
          for u in / "/berita/$S" /kategori/pendidikan /kategori/jateng-diy/51 /kategori/semua/118 /cari /event /login /dashboard; do c=$(code "$u"); echo "$c $u"; test "$c" = 200; done
          for u in /berita/tidak-ada /kategori/tidak-ada /kategori/semua/119 /halaman-lain; do c=$(code "$u"); echo "$c $u"; test "$c" = 404; done
          curl -s "$B/berita/$S" | grep -q 'article-content'
          echo "::notice::Situs dinamis menjawab dari backend asli"

      - name: Backend bisa dinyalakan ulang (migrasi kedua kali)
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          pkill -f /tmp/server || true
          sleep 1
          /tmp/server > /tmp/server2.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/news > /dev/null && break; sleep 1; done
          cat /tmp/server2.log | head -20
          if grep -q SeedNews /tmp/server2.log; then echo "arsip dimuat dua kali"; exit 1; fi
          curl -sfD - -o /dev/null "http://localhost:3000/api/news?limit=1" | grep -i "x-total-count: 2817"

      - name: Log backend
        if: failure()
        run: |
          tail -n 120 /tmp/server.log || true
          echo "::error::$(grep -iE "error|panic|fatal|gagal" /tmp/server.log | tail -8 | cut -c1-300 | tr '\n' '|')"
